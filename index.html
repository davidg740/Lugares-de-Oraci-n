<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">

<title>Elevando nuestras voces | Iglesia de Dios</title>

<style>

:root{
  --bg:#07111f;
  --card:#101c2e;
  --text:#f8fafc;
  --muted:#b7c3d4;
  --accent:#8b5cf6;
  --accent2:#22d3ee;
  --success:#22c55e;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at top,#172554 0%,transparent 35%),
    linear-gradient(160deg,#07111f 0%,#111827 55%,#172554 100%);
  color:var(--text);
  min-height:100vh;
}

main{
  max-width:760px;
  margin:auto;
  padding:18px 16px 45px;
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  padding:34px 22px 32px;
  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(139,92,246,.30),
      rgba(34,211,238,.13)
    );

  border:1px solid rgba(255,255,255,.13);

  box-shadow:
    0 20px 55px rgba(0,0,0,.30);

  animation:heroEntrada .8s ease both;
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(5px);
  opacity:.45;
  pointer-events:none;
}

.hero:before{
  width:190px;
  height:190px;
  background:#8b5cf6;
  top:-120px;
  left:-70px;
}

.hero:after{
  width:190px;
  height:190px;
  background:#22d3ee;
  bottom:-125px;
  right:-70px;
}

.logo{
  position:relative;
  z-index:1;

  width:225px;
  max-width:76%;
  height:auto;

  display:block;
  margin:0 auto 18px;

  filter:
    drop-shadow(0 0 16px rgba(255,255,255,.20));

  animation:logoEntrada 1s ease .15s both;
}

.hero h1{
  position:relative;
  z-index:1;

  font-size:clamp(34px,9vw,58px);
  line-height:1.02;

  margin:0;

  font-weight:900;
  letter-spacing:-1.5px;

  animation:textoEntrada .8s ease .25s both;
}

.slogan{
  position:relative;
  z-index:1;

  margin:10px 0 0;

  font-size:clamp(18px,4.5vw,23px);
  line-height:1.2;

  color:#dbeafe;
  font-weight:700;

  animation:textoEntrada .8s ease .35s both;
}

.message{
  position:relative;
  z-index:1;

  margin:13px auto 0;

  max-width:560px;

  font-size:16px;
  line-height:1.45;

  color:#dbeafe;
  font-weight:600;

  animation:textoEntrada .8s ease .45s both;
}


/* =========================
   FRASE
========================= */

.welcome{
  text-align:center;
  padding:25px 12px 10px;

  animation:entrada .7s ease .4s both;
}

.welcome h2{
  margin:0;

  font-size:clamp(24px,6vw,32px);

  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #fff,
      #c4b5fd,
      #67e8f9
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.welcome p{
  margin:8px 0 0;

  color:var(--muted);

  font-size:15px;
}


/* =========================
   BOTÓN UBICACIÓN
========================= */

.location-box{
  margin:15px 0 20px;

  animation:entrada .7s ease .5s both;
}

.location-btn{
  width:100%;

  border:0;
  border-radius:18px;

  padding:17px 18px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #6366f1
    );

  font-family:inherit;
  font-size:16px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 10px 28px rgba(99,102,241,.30);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.location-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 14px 32px rgba(99,102,241,.40);
}

.location-btn:active{
  transform:scale(.98);
}

.location-result{
  display:none;

  margin-top:10px;

  padding:13px 15px;

  border-radius:14px;

  background:rgba(34,197,94,.10);

  border:1px solid rgba(34,197,94,.22);

  color:#bbf7d0;

  font-size:14px;

  text-align:center;
}


/* =========================
   BUSCADOR
========================= */

.search-box{
  position:relative;

  margin-bottom:16px;

  animation:entrada .7s ease .6s both;
}

.search-icon{
  position:absolute;

  left:16px;
  top:50%;

  transform:translateY(-50%);

  font-size:18px;

  opacity:.75;
}

#search{
  width:100%;

  border:1px solid rgba(255,255,255,.12);

  outline:none;

  border-radius:17px;

  padding:16px 17px 16px 47px;

  background:rgba(16,28,46,.88);

  color:white;

  font-family:inherit;
  font-size:15px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.15);

  transition:
    border .2s ease,
    box-shadow .2s ease;
}

#search::placeholder{
  color:#8997aa;
}

#search:focus{
  border-color:rgba(139,92,246,.75);

  box-shadow:
    0 0 0 3px rgba(139,92,246,.12);
}


/* =========================
   TÍTULO LISTADO
========================= */

.list-title{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin:4px 4px 12px;

  color:#dbeafe;

  font-size:14px;
  font-weight:800;
}

.count{
  color:#8fa0b7;
  font-weight:600;
}


/* =========================
   IGLESIAS
========================= */

.churches{
  display:grid;
  gap:14px;
}

.card{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(16,28,46,.94),
      rgba(13,24,41,.90)
    );

  border:1px solid rgba(255,255,255,.10);

  border-radius:21px;

  padding:19px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.18);

  animation:cardEntrada .65s ease both;

  transition:
    transform .22s ease,
    border .22s ease,
    box-shadow .22s ease;
}

.card:before{
  content:"";

  position:absolute;

  width:90px;
  height:90px;

  right:-35px;
  top:-35px;

  border-radius:50%;

  background:#8b5
