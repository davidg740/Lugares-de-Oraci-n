<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">

<title>Elevando nuestras voces | Iglesia de Dios</title>

<style>
:root{
  --bg:#07111f;
  --card:#101c2e;
  --text:#f8fafc;
  --muted:#b7c3d4;
  --accent:#8b5cf6;
  --accent2:#22d3ee;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:linear-gradient(160deg,#07111f 0%,#111827 55%,#172554 100%);
  color:var(--text);
  min-height:100vh;
}

main{
  max-width:760px;
  margin:auto;
  padding:24px 18px 44px;
}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  padding:34px 24px 34px;
  text-align:center;
  background:linear-gradient(
    145deg,
    rgba(139,92,246,.28),
    rgba(34,211,238,.12)
  );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 55px rgba(0,0,0,.28);
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(2px);
  opacity:.5;
}

.hero:before{
  width:180px;
  height:180px;
  background:#8b5cf6;
  top:-110px;
  left:-70px;
}

.hero:after{
  width:180px;
  height:180px;
  background:#22d3ee;
  bottom:-120px;
  right:-70px;
}

.logo{
  position:relative;
  width:210px;
  max-width:70%;
  height:auto;
  display:block;
  margin:0 auto 18px;
  filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
}

.hero h1{
  position:relative;
  font-size:clamp(34px,9vw,58px);
  line-height:1.05;
  margin:0;
  font-weight:900;
  letter-spacing:-1px;
}

.hero .slogan{
  position:relative;
  margin:9px 0 0;
  font-size:clamp(17px,4.5vw,22px);
  line-height:1.2;
  color:#dbeafe;
  font-weight:600;
}

.hero .message{
  position:relative;
  margin:12px 0 0;
  font-size:16px;
  line-height:1.4;
  color:#dbeafe;
  font-weight:600;
}

.intro{
  text-align:center;
  color:var(--muted);
  margin:26px 8px 20px;
  font-size:16px;
}

.churches{
  display:grid;
  gap:14px;
}

.card{
  background:rgba(16,28,46,.88);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
}

.name{
  font-weight:800;
  font-size:18px;
  margin-bottom:6px;
}

.address{
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
}

.btn{
  display:inline-block;
  flex:none;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),#6366f1);
  font-weight:800;
  padding:12px 15px;
  border-radius:13px;
  font-size:14px;
  box-shadow:0 7px 20px rgba(99,102,241,.25);
}

.btn:active{
  transform:scale(.98);
}

footer{
  text-align:center;
  color:#8190a6;
  font-size:12px;
  margin-top:28px;
}

@media(max-width:520px){

  .card{
    align-items:flex-start;
    flex-direction:column;
  }

  .btn{
    width:100%;
    text-align:center;
  }

  .hero{
    padding-top:30px;
  }

}
</style>
</head>
